<!doctype html>
<html lang="zh-CN">
<head>

      <button class="button account-button" type="button" id="student-account">我的</button>
    </div>
  </header>
  <nav class="student-nav" aria-label="学生导航 / Student navigation">
    <div class="nav-inner">
      <a href="#home" data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v11H3zM9 21v-8h6v8"/></svg><span>服务首页</span></a>

    </div>
  </nav>

  <main id="content" class="student-main" tabindex="-1" aria-busy="true"><p class="notice">正在加载服务… / Loading service…</p></main>
