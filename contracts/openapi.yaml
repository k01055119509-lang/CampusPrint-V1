  title: CampusPrint V1 API
  version: 1.4.0
  description: 独立公告、结构化接收默认、收款禁取消、用户直接取消自动退原券并隐藏商户列表、审核与商家补偿、固定核款退回及删除新增财务异常。价格规则1.1.0不变。
