      operationId: get__me_orders__id__compensation_code
      summary: 所有者专用读取补偿完整码
      description: >-
        仅原所有者，受限恢复授权403、他人或未发放404。已核销
        code=null/unavailableReason=redeemed；其他未核销券可读取，是否到期/停用看摘要。完整码不写普通DTO、事件、日志、幂等结果或URL。
      tags:
        - Print
      x-roles:
        - user
      x-cp-surface: student
      security:
        - StudentSessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-CP-Surface
          in: header
          required: false
          schema:
            type: string
            enum:
              - student
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/CompensationCode'
                required:
                  - success
                  - data
        '400':
          description: 参数、页数或配送楼栋无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '403':
          description: 角色、来源或 CSRF 失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '404':
          description: 不存在或属于他人
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '409':
          description: 版本、幂等键、报价、财务或履约状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '410':
          description: 文件已到期禁止读取或再生成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '413':
          description: 上传/资源超过上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '415':
          description: 请求或文件格式不支持
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '422':
          description: 文件准备失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '429':
          description: 限流，稍后重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '500':
          description: 内部失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '503':
          description: 维护或存储/台账暂不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
components:
  securitySchemes:
    StudentSessionCookie:
      type: apiKey
      in: cookie
      name: cp_student_session
      description: 生产 __Host-cp_student_session；访客或已开启学生账号会话。HttpOnly、SameSite=Lax、Path=/，生产 Secure。
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: cp_admin_session
      description: 生产 __Host-cp_admin_session；仅管理员。旧 cp_session / __Host-cp_session 只经数据库角色核验迁移管理员，保留原到期时间。
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    BusinessError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
