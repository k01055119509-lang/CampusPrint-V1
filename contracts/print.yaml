        - room
        - contact
        - notes
        - copies
        - duplex
        - updatedAt
        - receiptMethod
        - receiptNote
    PrintDefaultsPatch:
      type: object
      additionalProperties: false
      properties:
        buildingId:
          type: string
          enum:
            - local-dorm
        room:
          type: string
          minLength: 0
          maxLength: 40
        contact:
          type: string
          minLength: 0
          maxLength: 120
        notes:
          type: string
          minLength: 0
          maxLength: 500
        copies:
          type: integer
          minimum: 1
          maximum: 99
        duplex:
          type: boolean
        receiptMethod:
          type: string
          enum:
            - handover
            - contact_first
            - doorstep
            - other
          nullable: true
        receiptNote:
          type: string
          minLength: 0
          maxLength: 500
      description: >-
        按字段实际出现局部更新；省略不清空。receiptMethod 可空，不从 notes 猜测。contact_first 必须有 contact，other 必须有 receiptNote。结构化接收方式优先；notes
        仅兼容旧说明，不能替代 receiptNote。
    QuoteInput:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              fileId:
                type: string
                format: uuid
              pages:
                type: string
                minLength: 1
                maxLength: 4000
              copies:
                type: integer
                minimum: 1
                maximum: 99
              duplex:
                type: boolean
            required:
              - fileId
              - pages
              - copies
              - duplex
          minItems: 1
          maxItems: 20
        couponCode:
          type: string
          minLength: 0
          maxLength: 256
          writeOnly: true
          description: 可选；空串不用券，25 有效字符；大小写、空白及分组连字符归一。完整码不进入报价或订单响应。
      required:
        - items
    PrintItem:
      type: object
      additionalProperties: false
      properties:
        itemId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        originalName:
          type: string
          minLength: 1
          maxLength: 180
        sourceSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        sourcePageCount:
          type: integer
          minimum: 1
          maximum: 2000
        pageNumbers:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 2000
          minItems: 1
          maxItems: 99
          uniqueItems: true
        selectedPageCount:
          type: integer
          minimum: 1
          maximum: 99
        copies:
          type: integer
          minimum: 1
          maximum: 99
        duplex:
          type: boolean
        contentPages:
          type: integer
          minimum: 1
          maximum: 99
        sheetCount:
          type: integer
          minimum: 1
          maximum: 99
        amountFen:
          type: integer
          minimum: 50
          maximum: 4950
        paperSize:
          type: string
          enum:
            - A4
        colorMode:
          type: string
          enum:
            - black_white
        copiesInPdf:
          type: integer
