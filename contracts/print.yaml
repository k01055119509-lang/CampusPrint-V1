        channel:
          type: string
          enum:
            - wechat
            - alipay
            - other
        reference:
          type: string
          minLength: 1
          maxLength: 160
        confirmedAt:
          type: string
          format: date-time
        confirmedBy:
          type: string
          format: uuid
        note:
          type: string
          minLength: 0
          maxLength: 1000
