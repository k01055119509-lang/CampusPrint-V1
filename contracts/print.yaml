              enum:
                - STUDENT_ACCOUNTS_DISABLED
                - ORDERS_PAUSED
                - ORDER_CANCELLATION_BLOCKED
                - PAYMENT_AMOUNT_MISMATCH
                - FINANCIAL_EXCEPTION_RECORDING_REMOVED
                - MERCHANT_CANCEL_REQUEST_REMOVED
                - ORDER_HIDDEN_FROM_MERCHANT
                - SECURITY_STATE_CHANGED
                - SECURITY_QUESTIONS_REQUIRED
                - SECURITY_ANSWERS_INCORRECT
                - CURRENT_PASSWORD_INCORRECT
                - AUTH_REQUIRED
                - FORBIDDEN
                - FORBIDDEN_ORIGIN
                - NOT_FOUND
                - VALIDATION_ERROR
                - CONFLICT
                - RATE_LIMITED
                - JSON_REQUIRED
                - MULTIPART_REQUIRED
                - PAYLOAD_TOO_LARGE
                - SERVICE_UNAVAILABLE
                - MAINTENANCE
                - INTERNAL_ERROR
                - INVALID_FILENAME
                - INVALID_MULTIPART
                - UPLOAD_INTERRUPTED
                - UPLOAD_TIMEOUT
                - UPLOAD_BUSY
                - FILE_EMPTY
                - FILE_UNSUPPORTED_FORMAT
                - FILE_FORMAT_MISMATCH
                - FILE_CORRUPT
                - FILE_ENCRYPTED
                - FILE_UNSUPPORTED_CONTENT
                - FILE_SIZE_LIMIT
                - FILE_PIXEL_LIMIT
                - FILE_PAGE_LIMIT
                - FILE_OUTPUT_LIMIT
                - FILE_STORAGE_QUOTA
                - FILE_STORAGE_UNAVAILABLE
                - FILE_STORAGE_MISSING
                - FILE_LEDGER_UNAVAILABLE
                - FILE_PROCESSING
                - FILE_PROCESS_FAILED
                - FILE_PROCESS_TIMEOUT
                - FILE_PROCESS_CRASH
                - FILE_PROCESS_RETRY_LIMIT
                - FILE_PROCESS_UNSUPPORTED
                - FILE_PROCESS_INVALID_RESULT
                - FILE_QUEUE_FULL
                - FILE_BUSY
                - FILE_ENGINE_STOPPING
                - FILE_INVALID_PAGES
                - FILE_EXPIRED
                - FILE_ALREADY_CLAIMED
                - FILE_ARTIFACT_MISMATCH
                - FILE_EXPIRY_IMMUTABLE
                - FILE_INTEGRITY_FAILED
                - PREPARATION_CONFLICT
                - UNSAFE_STORAGE_PATH
                - CONTENT_PAGE_LIMIT
                - BUILDING_NOT_SUPPORTED
                - ORDERS_PAUSED
                - PAYMENT_NOT_CONFIGURED
                - PAYMENT_ASSET_UNAVAILABLE
                - PAYMENT_CONFIGURATION_CHANGED
                - ADVERTISEMENT_LIMIT
                - ADVERTISEMENT_ASSET_UNAVAILABLE
                - ADVERTISEMENT_CONFIGURATION_CHANGED
                - QUOTE_PROCESSING
                - QUOTE_EXPIRED
                - QUOTE_ALREADY_USED
                - QUOTE_INVALID
                - QUOTE_PRICING_CHANGED
                - QUOTE_CONFIRMATION_MISMATCH
                - QUOTE_PREPARATION_FAILED
                - QUOTE_PREPARATION_TIMEOUT
                - IDEMPOTENCY_CONFLICT
                - VERSION_CONFLICT
                - TRANSACTION_ALREADY_RECORDED
                - REFUND_LIMIT
                - REFUND_TRANSACTION_ALREADY_RECORDED
                - COUPON_INVALID
                - COUPON_UNAVAILABLE
                - COUPON_THRESHOLD_NOT_MET
                - COUPON_ZERO_TOTAL
                - COUPON_EXCEPTION_PENDING
            message:
              type: string
              minLength: 0
              maxLength: 2000
            fields:
              type: object
              additionalProperties:
                type: string
          required:
            - code
            - message
      required:
        - success
        - error
    BusinessFileError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 0
          maxLength: 100
        message:
          type: string
          minLength: 0
          maxLength: 2000
      required:
        - code
        - message
      nullable: true
    PricingRules:
      type: object
      additionalProperties: false
      properties:
        singleSidedSheetPriceFen:
          type: integer
          enum:
            - 50
        doubleSidedSheetPriceFen:
          type: integer
          enum:
            - 90
        oddTailSheetPriceFen:
          type: integer
          enum:
            - 50
      required:
        - singleSidedSheetPriceFen
        - doubleSidedSheetPriceFen
        - oddTailSheetPriceFen
    LegacyPricingRules:
      type: object
      additionalProperties: false
      properties:
        unitSheetPriceFen:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - unitSheetPriceFen
    Totals:
      type: object
      additionalProperties: false
      properties:
        contentPages:
          type: integer
          minimum: 1
          maximum: 99
        sheetCount:
          type: integer
          minimum: 1
          maximum: 99
        pricingVersion:
          type: string
          enum:
            - 1.1.0
            - legacy
        pricingRules:
          oneOf:
            - $ref: '#/components/schemas/PricingRules'
            - $ref: '#/components/schemas/LegacyPricingRules'
        unitSheetPriceFen:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        printAmountFen:
          type: integer
          minimum: 1
          maximum: 4950
        discountAmountFen:
          type: integer
          minimum: 0
          maximum: 4949
        deliveryFeeFen:
          type: integer
          enum:
            - 0
        totalAmountFen:
          type: integer
          minimum: 1
          maximum: 4950
        currency:
          type: string
          enum:
            - CNY
      required:
        - contentPages
        - sheetCount
        - pricingVersion
        - pricingRules
        - printAmountFen
        - discountAmountFen
        - deliveryFeeFen
        - totalAmountFen
        - currency
    PrintConfig:
      type: object
      additionalProperties: false
      properties:
        paperSize:
          type: string
          enum:
            - A4
        colorMode:
          type: string
          enum:
            - black_white
        unitSheetPriceFen:
          type: integer
          enum:
            - 50
          deprecated: true
          description: 仅为原单面价格的兼容字段，不能用于新双面计价。
        pricingVersion:
          type: string
          enum:
            - 1.1.0
        singleSidedSheetPriceFen:
          type: integer
          enum:
            - 50
        doubleSidedSheetPriceFen:
          type: integer
          enum:
            - 90
        oddTailSheetPriceFen:
          type: integer
          enum:
            - 50
        minContentPages:
          type: integer
          enum:
            - 1
        maxContentPages:
          type: integer
          enum:
            - 99
        deliveryFeeFen:
          type: integer
          enum:
            - 0
        currency:
          type: string
          enum:
            - CNY
        building:
          type: object
          additionalProperties: false
          properties:
