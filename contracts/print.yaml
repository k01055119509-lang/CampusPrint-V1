          enum:
            - user
            - merchant
            - legacy
          nullable: true
      required:
        - id
        - orderId
        - reason
        - status
        - createdAt
        - createdBy
        - resolvedAt
        - resolvedBy
        - resolution
        - origin
    Refund:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
