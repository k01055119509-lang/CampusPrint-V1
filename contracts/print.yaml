            - stop
          nullable: true
        payoutNote:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
      required:
        - id
        - orderId
        - status
        - amountFen
        - reason
        - createdAt
        - createdBy
        - decidedAt
        - decidedBy
        - decisionNote
        - paidAt
        - paidBy
        - payoutReference
        - fulfillmentDecision
        - payoutNote
    OrderEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
