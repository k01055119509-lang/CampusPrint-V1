            - doorstep
            - other
        receiptNote:
          type: string
          minLength: 0
          maxLength: 500
      required:
        - buildingId
        - room
        - receiptMethod
      description: 新单必选 receiptMethod，缺失不猜测；contact_first 必须有 contact，other 必须有 receiptNote；notes 兼容保留。旧订单快照原样只读。
    OrderInput:
      type: object
      additionalProperties: false
      properties:
        quoteId:
          type: string
          format: uuid
        quoteFingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
