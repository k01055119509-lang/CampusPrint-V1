        - Print
      x-roles: []
      x-cp-surface: student
      security: []
      parameters:
        - name: X-CP-Surface
          in: header
          required: false
          schema:
            type: string
            enum:
              - student
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/PrintConfig'
                required:
                  - success
                  - data
        '400':
          description: 参数、页数或配送楼栋无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessError'
        '401':
          description: 未登录
