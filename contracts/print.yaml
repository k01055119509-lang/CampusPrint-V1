          type: boolean
        serviceNotice:
          type: string
          minLength: 0
          maxLength: 2000
        payment:
          type: object
          additionalProperties: false
          properties:
            configured:
              type: boolean
            qrUrl:
              type: string
              minLength: 0
              maxLength: 100
              nullable: true
            instructions:
              type: string
              minLength: 0
              maxLength: 1000
            channels:
              type: array
              items:
                $ref: '#/components/schemas/PaymentChannel'
              minItems: 2
              maxItems: 2
            legacy:
              $ref: '#/components/schemas/LegacyPayment'
          required:
            - configured
            - qrUrl
            - instructions
            - channels
            - legacy
        fileRetentionDaysAfterCompletion:
          type: integer
          enum:
            - 7
        temporaryUploadHours:
          type: integer
          enum:
            - 24
        quoteValiditySeconds:
          type: integer
          enum:
            - 900
        maxQuoteItems:
          type: integer
          enum:
            - 20
        uploadLimits:
          $ref: ./base.yaml#/components/schemas/UploadLimits
        maintenance:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            message:
              type: string
              minLength: 0
              maxLength: 500
            updatedAt:
              type: string
              format: date-time
              nullable: true
          required:
            - enabled
            - message
            - updatedAt
        advertisementsEnabled:
          type: boolean
        receiptMethods:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                  - handover
                  - contact_first
                  - doorstep
                  - other
              label:
                type: string
                minLength: 1
                maxLength: 40
            required:
              - code
              - label
      required:
        - paperSize
        - colorMode
        - unitSheetPriceFen
        - pricingVersion
        - singleSidedSheetPriceFen
        - doubleSidedSheetPriceFen
        - oddTailSheetPriceFen
        - minContentPages
        - maxContentPages
        - deliveryFeeFen
        - currency
        - building
        - acceptingOrders
        - serviceNotice
        - payment
        - fileRetentionDaysAfterCompletion
        - temporaryUploadHours
        - quoteValiditySeconds
        - maxQuoteItems
        - uploadLimits
        - maintenance
        - advertisementsEnabled
        - receiptMethods
    PrintDefaults:
      type: object
      additionalProperties: false
      properties:
        buildingId:
          type: string
          enum:
            - local-dorm
        room:
          type: string
          minLength: 0
          maxLength: 40
        contact:
          type: string
          minLength: 0
          maxLength: 120
        notes:
          type: string
          minLength: 0
          maxLength: 500
        copies:
          type: integer
          minimum: 1
          maximum: 99
        duplex:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          nullable: true
        receiptMethod:
          type: string
          enum:
            - handover
            - contact_first
            - doorstep
            - other
          nullable: true
        receiptNote:
          type: string
          minLength: 0
          maxLength: 500
      required:
