            - approved
            - rejected
            - paid_out
        amountFen:
          type: integer
          minimum: 1
          maximum: 4950
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
          nullable: true
        decidedBy:
          type: string
          format: uuid
          nullable: true
        decisionNote:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        paidBy:
          type: string
          format: uuid
          nullable: true
        payoutReference:
          type: string
          minLength: 1
          maxLength: 160
          nullable: true
        fulfillmentDecision:
          type: string
          enum:
