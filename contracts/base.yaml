              - purgeAttempts
              - code
        temporaryCleanupFailures:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              jobId:
                type: string
                format: uuid
              code:
                type: string
            required:
              - jobId
              - code
        ledgerError:
          type: string
          nullable: true
        processing:
          type: object
          additionalProperties: false
          properties:
            running:
              type: integer
              minimum: 0
            queued:
              type: integer
              minimum: 0
            maxConcurrent:
