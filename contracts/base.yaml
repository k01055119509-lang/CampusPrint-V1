openapi: 3.0.3
info:
  title: CampusPrint Foundation API
  version: 1.4.0
  description: 双 Cookie/CSRF、固定七天访客与保留的账号功能；休息时拒绝新上传；广告能力默认关闭；UTC 时间，上海显示。经营业务见 print.yaml。
servers:
  - url: /api
paths:
  /auth/csrf:
    get:
      summary: 获取匿名或当前会话 CSRF
      description: 首次获取创建匿名 HttpOnly cookie。JSON 写请求和 multipart 上传均使用 X-CSRF-Token。
      tags:
        - Foundation
      x-roles: []
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Csrf'
                required:
                  - success
                  - data
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - student
              - admin
            default: student
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: select
  /auth/guest:
    post:
      summary: 初始化独立访客或复用当前学生身份
      description: 学生上下文，先取 CSRF。固定七天自访客创建起计，不续期。IP 限流持久化。返回 X-CSRF-Token。
      tags:
        - Foundation
      x-roles: []
      security:
        - StudentSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Identity'
                required:
                  - success
                  - data
          headers:
            X-CSRF-Token:
              schema:
                type: string
              description: 新访客旋转后的当前学生 CSRF；复用身份时不旋转。
            Set-Cookie:
              schema:
                type: string
              description: 该端独立 HttpOnly Cookie；生产使用 __Host- 前缀、Secure、SameSite=Lax。
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - student
            default: student
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: student
  /auth/register:
    post:
      summary: 注册普通用户并登录
      description: STUDENT_ACCOUNTS_ENABLED 默认 false；关闭返回 403 STUDENT_ACCOUNTS_DISABLED。
      tags:
        - Foundation
      x-roles: []
      security:
        - StudentSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Identity'
                required:
                  - success
                  - data
          headers:
            X-CSRF-Token:
              description: 登录/注册旋转后的 CSRF，后续写入须使用此值
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: 该端独立 HttpOnly Cookie；生产使用 __Host- 前缀、Secure、SameSite=Lax。
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - student
            default: student
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: student
  /auth/login:
    post:
      summary: 学生登录
      description: 账号关闭返回 403 STUDENT_ACCOUNTS_DISABLED。访客主体没有可登录密码。
      tags:
        - Foundation
      x-roles: []
      security:
        - StudentSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Identity'
                required:
                  - success
                  - data
          headers:
            X-CSRF-Token:
              description: 登录/注册旋转后的 CSRF，后续写入须使用此值
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: 该端独立 HttpOnly Cookie；生产使用 __Host- 前缀、Secure、SameSite=Lax。
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - student
            default: student
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: student
  /auth/admin-login:
    post:
      summary: 管理员独立登录
      description: 固定管理员上下文；CSRF 也须使用管理员上下文获取。普通账号不能从本接口登录。管理员由 admin:init 创建，没有默认密码。
      tags:
        - Foundation
      x-roles: []
      security:
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Identity'
                required:
                  - success
                  - data
          headers:
            X-CSRF-Token:
              description: 登录/注册旋转后的 CSRF，后续写入须使用此值
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: 该端独立 HttpOnly Cookie；生产使用 __Host- 前缀、Secure、SameSite=Lax。
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - admin
            default: admin
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: admin
  /auth/me:
    get:
      summary: 当前身份与登录活跃信息
      description: ''
      tags:
        - Foundation
      x-roles:
        - user
        - admin
      security:
        - StudentSessionCookie: []
        - AdminSessionCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Identity'
                required:
                  - success
                  - data
          headers:
            X-CSRF-Token:
              description: 登录/注册旋转后的 CSRF，后续写入须使用此值
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: 该端独立 HttpOnly Cookie；生产使用 __Host- 前缀、Secure、SameSite=Lax。
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - student
              - admin
            default: student
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: select
  /auth/logout:
    post:
      summary: 退出并使会话失效
      description: ''
      tags:
        - Foundation
      x-roles:
        - user
        - admin
      security:
        - StudentSessionCookie: []
          CsrfToken: []
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      loggedOut:
                        type: boolean
                        enum:
                          - true
                    required:
                      - loggedOut
                required:
                  - success
                  - data
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - student
              - admin
            default: student
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: select
  /me/profile:
    patch:
      summary: 修改昵称
      description: ' 访客拒绝；学生账号关闭时返回 403 STUDENT_ACCOUNTS_DISABLED，管理员仍可用。'
      tags:
        - Foundation
      x-roles:
        - user
        - admin
      security:
        - StudentSessionCookie: []
          CsrfToken: []
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 80
              required:
                - nickname
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Identity'
                required:
                  - success
                  - data
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - student
              - admin
            default: student
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: select
      x-identity-kinds:
        - account
  /me/security-questions:
    get:
      summary: 获取当前账号的密保设置
      description: 仅返回问题、配置状态、版本和可选问题；从不返回答案或答案哈希。 访客拒绝；学生账号关闭时返回 403 STUDENT_ACCOUNTS_DISABLED，管理员仍可用。
      tags:
        - Foundation
      x-roles:
        - user
        - admin
      security:
        - StudentSessionCookie: []
        - AdminSessionCookie: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/SecurityState'
                required:
                  - success
                  - data
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - student
              - admin
            default: student
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: select
      x-identity-kinds:
        - account
    post:
      summary: 一次设置或更换三个密保问题
      description: >-
        首次 expectedVersion=0，必须提供 currentPassword；更换必须提供全部三个原 answers。问题不可重复。账号连续验证失败五次后须等待十五分钟；同 IP 十五分钟最多三十次提交。
        访客拒绝；学生账号关闭时返回 403 STUDENT_ACCOUNTS_DISABLED，管理员仍可用。
      tags:
        - Foundation
      x-roles:
        - user
        - admin
      security:
        - StudentSessionCookie: []
          CsrfToken: []
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecuritySetup'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/SecurityState'
                required:
                  - success
                  - data
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - student
              - admin
            default: student
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: select
      x-identity-kinds:
        - account
  /me/password:
    post:
      summary: 验证全部密保答案后修改密码
      description: >-
        只对当前登录账号操作。无密保不可改密，三个答案须全对。新密码 6–12 位，仅允许英文字母和数字且二者都必须包含。成功撤销所有旧会话并为当前浏览器旋转 cookie 和 CSRF。 访客拒绝；学生账号关闭时返回 403
        STUDENT_ACCOUNTS_DISABLED，管理员仍可用。
      tags:
        - Foundation
      x-roles:
        - user
        - admin
      security:
        - StudentSessionCookie: []
          CsrfToken: []
        - AdminSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    additionalProperties: false
                    properties:
                      passwordChanged:
                        type: boolean
                        enum:
                          - true
                      otherSessionsRevoked:
                        type: boolean
                        enum:
                          - true
                    required:
                      - passwordChanged
                      - otherSessionsRevoked
                required:
                  - success
                  - data
          headers:
            X-CSRF-Token:
              description: 登录/注册旋转后的 CSRF，后续写入须使用此值
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
              description: 该端独立 HttpOnly Cookie；生产使用 __Host- 前缀、Secure、SameSite=Lax。
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - student
              - admin
            default: student
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: select
      x-identity-kinds:
        - account
  /public/config:
    get:
      summary: 公开基础配置和文件资源上限
      description: capabilities 按实际模块返回；打印配置与收款状态以 /print/config 为准。
      tags:
        - Files
      x-roles: []
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/PublicConfig'
                required:
                  - success
                  - data
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - student
              - admin
            default: student
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: select
  /files:
    post:
      summary: 上传一个私有文件
      description: >-
        休息时在接收文件前返回 409 ORDERS_PAUSED；已接受上传可完成。一个 file 字段，无额外字段。multipart 不设置 JSON Content-Type，也不手工构造 boundary。202
        表示完整接收后排队，不保证解析成功。查询 /files/{id}，失败给出 FILE_CORRUPT/FILE_ENCRYPTED/FILE_PAGE_LIMIT/FILE_PIXEL_LIMIT 等代码。
      tags:
        - Files
      x-roles:
        - user
      security:
        - StudentSessionCookie: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '202':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/File'
                required:
                  - success
                  - data
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '408':
          $ref: '#/components/responses/Error408'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
        - name: X-CP-Surface
          in: header
          schema:
            type: string
            enum:
              - student
            default: student
          description: 选择当前端的 Cookie/CSRF；不能作为授权凭证或回退到另一端。
      x-cp-surface: student
  /files/{id}:
    get:
      summary: 所属文件状态与真实源页数
      description: 普通用户仅访问自己的文件；管理员按履约访问。到期后元数据仍返回 200，status=expired，文件访问返回 410。
      tags:
        - Files
      x-roles:
        - user
        - admin
      security:
