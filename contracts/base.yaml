            purged:
              type: integer
              minimum: 0
            failures:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  snapshotId:
                    type: string
                  fileId:
                    type: string
                  code:
                    type: string
                required:
                  - snapshotId
                  - fileId
                  - code
          required:
            - examined
            - purged
            - failures
      required:
        - intervalMs
        - temporaryUploadHours
        - latestRun
        - pendingExpired
        - failures
        - temporaryCleanupFailures
        - ledgerError
        - processing
    UploadLimits:
      type: object
      additionalProperties: false
      properties:
        requestBytes:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        allowedExtensions:
          type: array
          items:
            type: string
        allowedMimeTypes:
          type: array
          items:
            type: string
        maxFileBytes:
          type: integer
          minimum: 1
        maxSourcePages:
          type: integer
          minimum: 1
        maxImagePixels:
          type: integer
          minimum: 1
        maxPagePixels:
          type: integer
          minimum: 1
        maxPreparedPages:
          type: integer
          minimum: 1
        maxDerivedBytes:
          type: integer
          minimum: 1
        maxTemporaryFilesPerUser:
          type: integer
          minimum: 1
        maxSourceBytesPerUser:
          type: integer
          minimum: 1
        maxActiveFilesPerUser:
          type: integer
          minimum: 1
        maxTotalActiveFiles:
          type: integer
          minimum: 1
        maxTotalSourceBytes:
          type: integer
          minimum: 1
        maxTotalDerivedBytes:
          type: integer
          minimum: 1
        minFreeDiskBytes:
          type: integer
          minimum: 1
        maxUploadsInFlight:
          type: integer
          minimum: 1
        maxJobsInFlight:
          type: integer
          minimum: 1
        maxQueuedJobs:
