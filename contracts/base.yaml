    PublicConfig:
      type: object
      additionalProperties: false
      properties:
        product:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              enum:
                - campus-print-v1
            name:
              type: string
            nameEn:
              type: string
            version:
              type: string
          required:
            - id
            - name
            - nameEn
            - version
        timezone:
          type: string
          enum:
            - Asia/Shanghai
        maintenance:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            message:
              type: string
            updatedAt:
              type: string
              format: date-time
              nullable: true
          required:
            - enabled
            - message
            - updatedAt
        auth:
          type: object
          additionalProperties: false
          properties:
            usernameRule:
              type: string
            passwordMinLength:
              type: integer
              enum:
                - 6
            passwordMaxLength:
              type: integer
              enum:
                - 12
            passwordPattern:
              type: string
              enum:
                - ^(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,12}$
            roles:
              type: array
              items:
                type: string
                enum:
                  - user
                  - admin
          required:
            - usernameRule
            - passwordMinLength
            - passwordMaxLength
            - passwordPattern
            - roles
        uploadLimits:
          $ref: '#/components/schemas/UploadLimits'
        capabilities:
          type: object
          additionalProperties: false
          properties:
            privateFiles:
              type: boolean
            orders:
              type: boolean
            advertisements:
              type: boolean
          required:
            - privateFiles
            - orders
            - advertisements
        studentAccountsEnabled:
          type: boolean
        guestSessionDays:
          type: integer
          enum:
            - 7
      required:
        - product
        - timezone
        - maintenance
        - auth
        - uploadLimits
        - capabilities
        - studentAccountsEnabled
        - guestSessionDays
    Identity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: ^[a-z0-9_]{3,32}$
          nullable: true
        nickname:
          type: string
          minLength: 1
          maxLength: 80
        role:
          type: string
          enum:
            - user
            - admin
        identityKind:
          type: string
          enum:
            - guest
            - account
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        lastActiveAt:
          type: string
          format: date-time
          nullable: true
        online:
          type: boolean
        sessionExpiresAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - nickname
        - role
        - identityKind
        - createdAt
        - lastLoginAt
        - lastActiveAt
        - online
        - sessionExpiresAt
  responses:
    Error400:
      description: 参数无效、损坏请求、页码语法或额外字段错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: 未登录或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: 角色、CSRF 或来源校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: 资源不存在或属于他人；不泄露资源存在性
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error408:
      description: 上传超时
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: 文件正在处理、已经认领或稳定任务标识冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error410:
      description: 文件到期/清理后禁止读取与再生成
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: 文件、像素、页数、存储资源上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error415:
      description: 格式/声明不匹配、不支持格式或加密/XFA 等内容
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: 文件损坏或处理失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: 请求、上传或处理队列限流
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: 至少等待的秒数
          schema:
            type: string
    Error500:
      description: 内部错误或存储路径检查失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: 维护、文件存储或期限台账不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
