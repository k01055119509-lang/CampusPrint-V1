components:
  securitySchemes:
    StudentSessionCookie:
      type: apiKey
      in: cookie
      name: cp_student_session
      description: 生产 __Host-cp_student_session；访客或已开启学生账号会话。HttpOnly、SameSite=Lax、Path=/，生产 Secure。
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: cp_admin_session
      description: 生产 __Host-cp_admin_session；仅管理员。旧 cp_session / __Host-cp_session 只经数据库角色核验迁移管理员，保留原到期时间。
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - STUDENT_ACCOUNTS_DISABLED
                - ORDERS_PAUSED
                - ORDER_CANCELLATION_BLOCKED
                - PAYMENT_AMOUNT_MISMATCH
                - FINANCIAL_EXCEPTION_RECORDING_REMOVED
                - MERCHANT_CANCEL_REQUEST_REMOVED
                - ORDER_HIDDEN_FROM_MERCHANT
                - SECURITY_STATE_CHANGED
                - SECURITY_QUESTIONS_REQUIRED
                - SECURITY_ANSWERS_INCORRECT
                - CURRENT_PASSWORD_INCORRECT
                - AUTH_REQUIRED
                - FORBIDDEN
                - FORBIDDEN_ORIGIN
                - NOT_FOUND
                - VALIDATION_ERROR
                - CONFLICT
                - RATE_LIMITED
                - JSON_REQUIRED
                - MULTIPART_REQUIRED
                - PAYLOAD_TOO_LARGE
                - SERVICE_UNAVAILABLE
                - MAINTENANCE
                - INTERNAL_ERROR
                - INVALID_FILENAME
                - INVALID_MULTIPART
                - UPLOAD_INTERRUPTED
                - UPLOAD_TIMEOUT
                - UPLOAD_BUSY
                - FILE_EMPTY
                - FILE_UNSUPPORTED_FORMAT
                - FILE_FORMAT_MISMATCH
                - FILE_CORRUPT
                - FILE_ENCRYPTED
                - FILE_UNSUPPORTED_CONTENT
                - FILE_SIZE_LIMIT
                - FILE_PIXEL_LIMIT
                - FILE_PAGE_LIMIT
                - FILE_OUTPUT_LIMIT
                - FILE_STORAGE_QUOTA
                - FILE_STORAGE_UNAVAILABLE
                - FILE_STORAGE_MISSING
                - FILE_LEDGER_UNAVAILABLE
                - FILE_PROCESSING
                - FILE_PROCESS_FAILED
                - FILE_PROCESS_TIMEOUT
                - FILE_PROCESS_CRASH
                - FILE_PROCESS_RETRY_LIMIT
                - FILE_PROCESS_UNSUPPORTED
                - FILE_PROCESS_INVALID_RESULT
                - FILE_QUEUE_FULL
                - FILE_BUSY
                - FILE_ENGINE_STOPPING
                - FILE_INVALID_PAGES
                - FILE_EXPIRED
                - FILE_ALREADY_CLAIMED
                - FILE_ARTIFACT_MISMATCH
                - FILE_EXPIRY_IMMUTABLE
                - FILE_INTEGRITY_FAILED
                - PREPARATION_CONFLICT
                - UNSAFE_STORAGE_PATH
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
          required:
            - code
            - message
      required:
        - success
        - error
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: ^[a-z0-9_]{3,32}$
          nullable: true
        nickname:
          type: string
          minLength: 1
          maxLength: 80
        role:
          type: string
          enum:
            - user
            - admin
        identityKind:
          type: string
          enum:
            - guest
            - account
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        lastActiveAt:
          type: string
          format: date-time
          nullable: true
        online:
          type: boolean
      required:
        - id
        - username
        - nickname
        - role
        - identityKind
        - createdAt
        - lastLoginAt
        - lastActiveAt
        - online
    Csrf:
      type: object
      additionalProperties: false
      properties:
        csrfToken:
          type: string
          pattern: ^[a-f0-9]{64}$
        expiresAt:
          type: string
          format: date-time
      required:
        - csrfToken
        - expiresAt
    Login:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: 登录保留旧密码兼容；新注册和改密使用 6–12 位字母数字规则
      required:
        - username
        - password
    Registration:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 6
          maxLength: 12
          pattern: ^(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,12}$
          writeOnly: true
      required:
        - username
        - password
    SecurityQuestion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          enum:
            - first_school
            - childhood_friend
            - childhood_place
            - favorite_teacher
            - first_pet
            - memorable_city
            - favorite_book
            - family_nickname
        zh:
          type: string
        en:
          type: string
      required:
        - id
        - zh
        - en
    SecurityState:
      type: object
      additionalProperties: false
      properties:
        configured:
          type: boolean
        version:
          type: integer
          minimum: 0
        questions:
          type: array
          items:
            $ref: '#/components/schemas/SecurityQuestion'
          maxItems: 3
        availableQuestions:
          type: array
          items:
            $ref: '#/components/schemas/SecurityQuestion'
      required:
        - configured
        - version
        - questions
        - availableQuestions
    SecurityAnswers:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 120
        writeOnly: true
      minItems: 3
      maxItems: 3
      description: 依返回的问题顺序填写全部三个答案；NFKC、首尾空格、连续空白和英文大小写归一；仅保存加盐 scrypt 哈希
    SecuritySetup:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        questions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              questionId:
                type: string
                enum:
                  - first_school
                  - childhood_friend
                  - childhood_place
                  - favorite_teacher
                  - first_pet
                  - memorable_city
                  - favorite_book
                  - family_nickname
              answer:
                type: string
                minLength: 1
                maxLength: 120
                writeOnly: true
            required:
              - questionId
              - answer
          minItems: 3
          maxItems: 3
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        answers:
          $ref: '#/components/schemas/SecurityAnswers'
      required:
        - expectedVersion
        - questions
    PasswordChange:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        answers:
          $ref: '#/components/schemas/SecurityAnswers'
        newPassword:
          type: string
          minLength: 6
          maxLength: 12
          pattern: ^(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9]{6,12}$
          writeOnly: true
      required:
        - expectedVersion
        - answers
        - newPassword
    FileError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
      nullable: true
    File:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
          maxLength: 180
        mimeType:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
        byteSize:
          type: integer
          minimum: 1
        sourcePageCount:
          type: integer
          minimum: 1
          maximum: 2000
          nullable: true
        sourceSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          type: string
          enum:
            - processing
            - ready
            - failed
            - expired
        error:
          $ref: '#/components/schemas/FileError'
        claimedOrderId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        uploadedAt:
          type: string
          format: date-time
        fileAvailability:
          type: string
          enum:
            - available
            - expired
            - deleted
        allowedActions:
          type: array
          items:
            type: string
            enum:
              - preview
              - delete
      required:
        - id
        - originalName
        - mimeType
        - byteSize
        - sourcePageCount
        - sourceSha256
        - status
        - error
        - claimedOrderId
        - expiresAt
        - uploadedAt
        - fileAvailability
        - allowedActions
    Artifact:
      type: object
      additionalProperties: false
      properties:
        artifactId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        preparationId:
          type: string
          nullable: true
        pageCount:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        byteSize:
          type: integer
          minimum: 1
        mimeType:
          type: string
        paperSize:
          type: string
          enum:
            - A4
        colorMode:
          type: string
          enum:
            - black_white
        copiesInPdf:
          type: integer
          enum:
            - 1
        sourceSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        pageNumbers:
          type: array
          items:
            type: integer
            minimum: 1
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required:
        - artifactId
        - fileId
        - preparationId
        - pageCount
        - sha256
        - byteSize
        - mimeType
        - paperSize
        - colorMode
        - copiesInPdf
        - sourceSha256
        - pageNumbers
        - expiresAt
    CleanupRun:
      type: object
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        examined:
          type: integer
          minimum: 0
        purged:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        deferred:
          type: integer
          minimum: 0
        finishedAt:
          type: string
          format: date-time
      required:
        - runId
        - startedAt
        - examined
        - purged
        - failed
        - deferred
        - finishedAt
    StoredCleanupRun:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        examined:
          type: integer
          minimum: 0
        purged:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        deferred:
          type: integer
          minimum: 0
        finishedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - startedAt
        - examined
        - purged
        - failed
        - deferred
        - finishedAt
      nullable: true
    CleanupStatus:
      type: object
      additionalProperties: false
      properties:
        intervalMs:
          type: integer
          maximum: 300000
        temporaryUploadHours:
          type: integer
          enum:
            - 24
        latestRun:
